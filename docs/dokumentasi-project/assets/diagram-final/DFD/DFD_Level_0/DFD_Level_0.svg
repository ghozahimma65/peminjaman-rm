  <text x="38" y="32" font-size="16" font-weight="bold" fill="#0f172a">Data Flow Diagram (DFD) Level 0 — Context Diagram</text>
  <text x="38" y="47" font-size="11" fill="#64748b">Diagram Konteks Sistem Informasi Filing Rekam Medis RSI Sultan Agung Semarang</text>

