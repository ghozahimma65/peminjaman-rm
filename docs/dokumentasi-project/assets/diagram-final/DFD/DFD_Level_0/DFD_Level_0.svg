<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Header Title Banner -->
  <rect x="0" y="0" width="1120" height="60" fill="#f8fafc"/>
  <line x1="0" y1="60" x2="1120" y2="60" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="24" y="16" width="6" height="28" rx="3" fill="#056839"/>
  <text x="38" y="32" font-size="16" font-weight="bold" fill="#0f172a">Data Flow Diagram (DFD) Level 0 — Context Diagram</text>
  <text x="38" y="47" font-size="11" fill="#64748b">Diagram Konteks Sistem Informasi Filing Rekam Medis (RSISA) — Hak Akses Tunggal Admin / Petugas</text>

  <!-- Diagram Content -->
  
  <!-- Process 0.0 -->
  <g class="dfd-process">
    <filter id="shadow_proc_430_200" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <rect x="430" y="200" width="260" height="220" rx="16" fill="#f0fdf4" stroke="#056839" stroke-width="2" filter="url(#shadow_proc_430_200)"/>
    <path d="M 430 216 A 16 16 0 0 1 446 200 L 674 200 A 16 16 0 0 1 690 216 L 690 226 L 430 226 Z" fill="#056839"/>
    <text x="560.0" y="218" font-size="11" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">PROSES 0.0</text>
    <text x="560.0" y="318.0" font-size="12" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#064e3b" text-anchor="middle">Sistem Informasi Filing Rekam Medis</text>
    <text x="560.0" y="333.0" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" fill="#047857" text-anchor="middle">Rumah Sakit Islam Sultan Agung</text>
  </g>
  
  <!-- Entity: Admin / Petugas -->
  <g class="dfd-entity">
    <filter id="shadow_ent_60_200" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <rect x="60" y="200" width="190" height="220" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow_ent_60_200)"/>
    <rect x="60" y="200" width="190" height="28" rx="6" fill="#334155"/>
    <rect x="60" y="220" width="190" height="8" fill="#334155"/>
    <text x="155.0" y="218" font-size="11" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Aktor Sistem</text>
    <text x="155.0" y="320.0" font-size="13" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#0f172a" text-anchor="middle">Admin / Petugas</text>
  </g>
  
  <!-- Entity: File System (OS) -->
  <g class="dfd-entity">
    <filter id="shadow_ent_870_245" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <rect x="870" y="245" width="190" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow_ent_870_245)"/>
    <rect x="870" y="245" width="190" height="28" rx="6" fill="#334155"/>
    <rect x="870" y="265" width="190" height="8" fill="#334155"/>
    <text x="965.0" y="263" font-size="11" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Penyimpanan Eksternal</text>
    <text x="965.0" y="320.0" font-size="13" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" fill="#0f172a" text-anchor="middle">File System (OS)</text>
  </g>
  
  <!-- Flows between Admin/Petugas and Process 0.0 -->
  <!-- Flow 1 -->
  <g class="dfd-flow">
    <path d="M 250 240 L 430 240" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="430,240 424,236 424,244" fill="#2563eb" transform="rotate(0.0, 430, 240)"/>
    <rect x="224.5" y="221" width="231.0" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="234" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">1. Kredensial Login (NIP, Password)</text>
  </g>
  
  <!-- Flow 2 -->
  <g class="dfd-flow">
    <path d="M 250 275 L 430 275" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="430,275 424,271 424,279" fill="#2563eb" transform="rotate(0.0, 430, 275)"/>
    <rect x="215.2" y="256" width="249.6" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="269" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">2. Data Registrasi Pasien &amp; Peminjaman</text>
  </g>
  
  <!-- Flow 3 -->
  <g class="dfd-flow">
    <path d="M 250 310 L 430 310" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="430,310 424,306 424,314" fill="#2563eb" transform="rotate(0.0, 430, 310)"/>
    <rect x="230.7" y="291" width="218.6" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="304" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">3. Konfirmasi Pengembalian Berkas</text>
  </g>
  
  <!-- Flow 4 -->
  <g class="dfd-flow">
    <path d="M 430 345 L 250 345" fill="none" stroke="#059669" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="250,345 244,341 244,349" fill="#059669" transform="rotate(180.0, 250, 345)"/>
    <rect x="219.0" y="346" width="242.0" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="359" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">4. Status Sesi, Data RM, Riwayat &amp; Log</text>
  </g>
  
  <!-- Flow 5 -->
  <g class="dfd-flow">
    <path d="M 430 380 L 250 380" fill="none" stroke="#d97706" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="250,380 244,376 244,384" fill="#d97706" transform="rotate(180.0, 250, 380)"/>
    <rect x="209.0" y="381" width="262.0" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="340" y="394" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">5. Notifikasi Peringatan (24h &amp; Overdue)</text>
  </g>
  
  <!-- Flows between Process 0.0 and File System (OS) -->
  <!-- Flow 8 (FS -> Process 0.0) -->
  <g class="dfd-flow">
    <path d="M 870 290 L 690 290" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="690,290 684,286 684,294" fill="#2563eb" transform="rotate(180.0, 690, 290)"/>
    <rect x="667.6" y="271" width="224.8" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="780" y="284" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">File Gambar Avatar (Binary Stream)</text>
  </g>
  
  <!-- Flow 9 (Process 0.0 -> FS) -->
  <g class="dfd-flow">
    <path d="M 690 330 L 870 330" fill="none" stroke="#059669" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="870,330 864,326 864,334" fill="#059669" transform="rotate(0.0, 870, 330)"/>
    <rect x="642.8" y="331" width="274.4" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="780" y="344" font-size="9.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" fill="#1e293b" text-anchor="middle">Dokumen Laporan Excel (.xlsx) &amp; PDF (.pdf)</text>
  </g>

  <!-- Footer Watermark -->
  <text x="1096" y="608" font-size="9.5" fill="#94a3b8" text-anchor="end">Filing Rekam Medis — RSI Sultan Agung Semarang</text>
</svg>