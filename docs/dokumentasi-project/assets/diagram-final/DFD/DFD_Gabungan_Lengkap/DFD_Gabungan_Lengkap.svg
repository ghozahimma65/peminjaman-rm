<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; }
      .badge-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1px; rx: 4px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05)); }
      .badge-txt { font-size: 9px; font-weight: 600; }
    </style>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Header Title Banner -->
  <rect x="0" y="0" width="1600" height="60" fill="#f8fafc"/>
  <line x1="0" y1="60" x2="1600" y2="60" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="24" y="16" width="6" height="28" rx="3" fill="#056839"/>
  <text x="38" y="32" font-size="16" font-weight="bold" fill="#0f172a">Data Flow Diagram (DFD) Gabungan Lengkap — Filing Rekam Medis</text>
  <text x="38" y="47" font-size="11" fill="#64748b">Arsitektur Aliran Data Siklus Operasional, Master RM, Sirkulasi, dan Pelaporan RSISA (Aktor Tunggal: Petugas Rekam Medis)</text>

  <!-- Zone Grouping Boxes -->
  <rect x="350" y="65" width="910" height="155" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="360" y="80" font-size="10" font-weight="bold" fill="#94a3b8">ZONA 1: OTENTIKASI &amp; KEAMANAN AKUN</text>

  <rect x="350" y="200" width="910" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="360" y="215" font-size="10" font-weight="bold" fill="#94a3b8">ZONA 2: MASTER REKAM MEDIS &amp; PASIEN</text>

  <rect x="350" y="300" width="910" height="385" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="360" y="315" font-size="10" font-weight="bold" fill="#94a3b8">ZONA 3: SIRKULASI OPERASIONAL, MONITORING DEADLINE &amp; PENGEMBALIAN</text>

  <rect x="350" y="695" width="960" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="360" y="710" font-size="10" font-weight="bold" fill="#94a3b8">ZONA 4: AKUNTABILITAS, PELAPORAN ANALITIK &amp; PROFIL</text>

  <!-- EXTERNAL ENTITY: PETUGAS REKAM MEDIS (AKTOR TUNGGAL) -->
  <g transform="translate(40, 80)">
    <rect width="210" height="852" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="15" width="186" height="70" rx="6" fill="#e2e8f0"/>
    <text x="105" y="35" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">[Aktor Tunggal Sistem]</text>
    <text x="105" y="55" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Petugas Rekam Medis</text>
    <text x="105" y="70" font-size="9" fill="#475569" text-anchor="middle">(Operator Filing &amp; Pengelolaan RM)</text>

    <text x="105" y="115" font-size="10" font-weight="bold" fill="#056839" text-anchor="middle">• Hak Akses Tunggal •</text>
    <text x="105" y="132" font-size="9.5" fill="#64748b" text-anchor="middle">Satu-satunya pengguna yang</text>
    <text x="105" y="146" font-size="9.5" fill="#64748b" text-anchor="middle">mengoperasikan aplikasi desktop</text>

    <!-- Visual Port Indicators -->
    <circle cx="210" cy="36" r="4" fill="#2563eb"/>
    <circle cx="210" cy="166" r="4" fill="#2563eb"/>
    <circle cx="210" cy="296" r="4" fill="#2563eb"/>
    <circle cx="210" cy="426" r="4" fill="#2563eb"/>
    <circle cx="210" cy="556" r="4" fill="#d97706"/>
    <circle cx="210" cy="686" r="4" fill="#2563eb"/>
    <circle cx="210" cy="816" r="4" fill="#2563eb"/>
  </g>

  <!-- External Entity: File System (OS) -->
  <g transform="translate(980, 726)">
    <rect width="260" height="80" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="130" y="24" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">[Penyimpanan Komputer]</text>
    <text x="130" y="44" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">File System (OS)</text>
    <text x="130" y="62" font-size="9.5" fill="#64748b" text-anchor="middle">(Direktori Unduhan / Ekspor Dokumen)</text>
  </g>

  <!-- PROCESSES (1.0 to 7.0) -->
  <g transform="translate(380, 80)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 1.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Autentikasi &amp; Sesi</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Verifikasi Kredensial NIP &amp; Bcrypt)</text>
  </g>

  <g transform="translate(380, 210)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 2.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Manajemen Data RM &amp; Pasien</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Master RM &amp; NIK 16 Digit)</text>
  </g>

  <g transform="translate(380, 340)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 3.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Peminjaman Berkas Fisik</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Single Active Loan &amp; Batas 48 Jam)</text>
  </g>

  <g transform="translate(380, 470)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 4.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Pengembalian &amp; Hapus Transaksi</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Cek Fisik, Catatan &amp; Riwayat Sirkulasi)</text>
  </g>

  <g transform="translate(380, 600)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 5.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Monitoring Notifikasi</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Peringatan 24 Jam &amp; Overdue)</text>
  </g>

  <g transform="translate(380, 730)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 6.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Laporan &amp; Ekspor Dokumen</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Rekapitulasi Sirkulasi Excel &amp; PDF)</text>
  </g>

  <g transform="translate(380, 860)">
    <rect width="270" height="72" rx="14" fill="#f0fdf4" stroke="#056839" stroke-width="2"/>
    <text x="135" y="25" font-size="11" font-weight="bold" fill="#056839" text-anchor="middle">PROSES 7.0</text>
    <text x="135" y="44" font-size="12" font-weight="bold" fill="#064e3b" text-anchor="middle">Profil &amp; Audit Log Pengguna</text>
    <text x="135" y="59" font-size="9.5" fill="#047857" text-anchor="middle">(Ubah Password, Avatar &amp; Log Login Petugas)</text>
  </g>

  <!-- DATA STORES -->
  <g transform="translate(980, 91)">
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="50" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">D1: users</text>
    <text x="130" y="38" font-size="9" fill="#475569" text-anchor="middle">(Tabel Akun &amp; Kredensial Petugas)</text>
  </g>

  <g transform="translate(980, 155)">
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="50" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">D2: login_logs</text>
    <text x="130" y="38" font-size="9" fill="#475569" text-anchor="middle">(Tabel Jejak Audit Login)</text>
  </g>

  <g transform="translate(980, 221)">
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="50" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,50 L 260,50 M 0,0 L 0,50" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">D3: data_rm</text>
    <text x="130" y="38" font-size="9" fill="#475569" text-anchor="middle">(Tabel Master Data Rekam Medis)</text>
  </g>

  <g transform="translate(980, 316)">
    <path d="M 0,0 L 260,0 M 0,120 L 260,120 M 0,0 L 0,120" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="120" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,120 L 260,120 M 0,0 L 0,120" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">D4: peminjaman</text>
    <text x="130" y="42" font-size="9.5" fill="#475569" text-anchor="middle">(Tabel Transaksi Peminjaman Berkas)</text>
    <line x1="20" y1="52" x2="240" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    <text x="130" y="68" font-size="8.5" fill="#059669" text-anchor="middle">• Port 340: Cek Ketersediaan Fisik (P2)</text>
    <text x="130" y="82" font-size="8.5" fill="#059669" text-anchor="middle">• Port 376: INSERT Peminjaman Baru (P3)</text>
    <text x="130" y="96" font-size="8.5" fill="#059669" text-anchor="middle">• Port 400: UPDATE 'DIKEMBALIKAN' (P4)</text>
    <text x="130" y="110" font-size="8.5" fill="#059669" text-anchor="middle">• Port 415: UPDATE 'TERLAMBAT' (P5) | 428: Query (P6)</text>
  </g>

  <g transform="translate(980, 466)">
    <path d="M 0,0 L 260,0 M 0,80 L 260,80 M 0,0 L 0,80" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="80" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,80 L 260,80 M 0,0 L 0,80" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="25" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">D5: pengembalian</text>
    <text x="130" y="43" font-size="9" fill="#475569" text-anchor="middle">(Tabel Transaksi Pengembalian Berkas)</text>
    <text x="130" y="65" font-size="8.5" fill="#059669" text-anchor="middle">• Port 490: Bebas Pinjam (P3) | 506: INSERT (P4)</text>
  </g>

  <g transform="translate(980, 606)">
    <path d="M 0,0 L 260,0 M 0,60 L 260,60 M 0,0 L 0,60" fill="none" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="60" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 0,0 L 260,0 M 0,60 L 260,60 M 0,0 L 0,60" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="26" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">D6: notifications</text>
    <text x="130" y="44" font-size="9" fill="#475569" text-anchor="middle">(Tabel Antrean Notifikasi Deadline)</text>
  </g>

  <!-- FLOWS: PETUGAS REKAM MEDIS <-> PROCESSES (100% HORIZONTAL LINES, CENTERED BADGES) -->
  <!-- 1.0 Login -->
  <line x1="250" y1="116" x2="378" y2="116" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="106" width="100" height="20" class="badge-bg"/>
  <text x="315" y="120" fill="#1e293b" class="badge-txt" text-anchor="middle">Kredensial Login</text>

  <!-- 2.0 Pasien -->
  <line x1="250" y1="246" x2="378" y2="246" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="236" width="100" height="20" class="badge-bg"/>
  <text x="315" y="250" fill="#1e293b" class="badge-txt" text-anchor="middle">Data RM &amp; Pasien</text>

  <!-- 3.0 Peminjaman -->
  <line x1="250" y1="376" x2="378" y2="376" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="366" width="100" height="20" class="badge-bg"/>
  <text x="315" y="380" fill="#1e293b" class="badge-txt" text-anchor="middle">Formulir Pinjam</text>

  <!-- 4.0 Pengembalian -->
  <line x1="250" y1="506" x2="378" y2="506" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="496" width="100" height="20" class="badge-bg"/>
  <text x="315" y="510" fill="#1e293b" class="badge-txt" text-anchor="middle">Form Pengembalian</text>

  <!-- 5.0 Notifikasi (Return flow) -->
  <line x1="380" y1="636" x2="252" y2="636" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="265" y="626" width="100" height="20" class="badge-bg"/>
  <text x="315" y="640" fill="#b45309" class="badge-txt" text-anchor="middle">Badge Peringatan</text>

  <!-- 6.0 Laporan -->
  <line x1="250" y1="766" x2="378" y2="766" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="756" width="100" height="20" class="badge-bg"/>
  <text x="315" y="770" fill="#1e293b" class="badge-txt" text-anchor="middle">Filter Periode Lap.</text>

  <!-- 7.0 Profil -->
  <line x1="250" y1="896" x2="378" y2="896" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="265" y="886" width="100" height="20" class="badge-bg"/>
  <text x="315" y="900" fill="#1e293b" class="badge-txt" text-anchor="middle">Update Profil</text>

  <!-- FLOWS: PROCESSES TO DATA STORES -->

  <!-- fl_ds1: P1 -> ds1 (y=116, straight) -->
  <line x1="650" y1="116" x2="978" y2="116" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="730" y="106" width="130" height="20" class="badge-bg"/>
  <text x="795" y="120" fill="#065f46" class="badge-txt" text-anchor="middle">Verifikasi PasswordHash</text>

  <!-- fl_ds2: P1 -> ds2 (y=138 -> 180) -->
  <path d="M 650,138 L 710,138 L 710,180 L 978,180" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="730" y="170" width="120" height="20" class="badge-bg"/>
  <text x="790" y="184" fill="#0369a1" class="badge-txt" text-anchor="middle">Catat Log Percobaan</text>

  <!-- fl_ds3: P2 -> ds3 (y=246, straight) -->
  <line x1="650" y1="246" x2="978" y2="246" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="740" y="236" width="150" height="20" class="badge-bg"/>
  <text x="815" y="250" fill="#065f46" class="badge-txt" text-anchor="middle">Insert / Select Master RM</text>

  <!-- fl_ds4: P2 -> ds4 (y=268 -> 340) -->
  <path d="M 650,268 L 740,268 L 740,340 L 978,340" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="760" y="330" width="145" height="20" class="badge-bg"/>
  <text x="832" y="344" fill="#0369a1" class="badge-txt" text-anchor="middle">Cek Fisik RM (EXISTS)</text>

  <!-- fl_ds5: P3 -> ds4 (y=376, straight) -->
  <line x1="650" y1="376" x2="978" y2="376" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="680" y="366" width="140" height="20" class="badge-bg"/>
  <text x="750" y="380" fill="#065f46" class="badge-txt" text-anchor="middle">INSERT Transaksi Pinjam</text>

  <!-- fl_ds6: P3 -> ds5 (x=780, y=398 -> 490) with Bridge Jumps over x=860 and x=900 -->
  <path d="M 650,398 L 780,398 L 780,490 
           L 854,490 A 6 6 0 0 1 866,490 
           L 894,490 A 6 6 0 0 1 906,490 
           L 978,490" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="670" y="405" width="130" height="20" class="badge-bg"/>
  <text x="735" y="419" fill="#0369a1" class="badge-txt" text-anchor="middle">Verifikasi Bebas Pinjam</text>

  <!-- fl_ds7: P4 -> ds4 (x=820, y=480 -> 400) -->
  <!-- Crosses fl_ds6 vertical line at x=780, y=480: We draw jump arc over x=780! -->
  <path d="M 650,480 
           L 774,480 A 6 6 0 0 1 786,480 L 820,480 
           L 820,400 L 978,400" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="670" y="468" width="135" height="20" class="badge-bg"/>
  <text x="737" y="482" fill="#065f46" class="badge-txt" text-anchor="middle">UPDATE 'DIKEMBALIKAN'</text>

  <!-- fl_ds8: P4 -> ds5 (y=506, straight) with Bridge Jump over x=860 and x=900 -->
  <path d="M 650,506 
           L 854,506 A 6 6 0 0 1 866,506 
           L 894,506 A 6 6 0 0 1 906,506 
           L 978,506" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="680" y="514" width="140" height="20" class="badge-bg"/>
  <text x="750" y="528" fill="#065f46" class="badge-txt" text-anchor="middle">INSERT Record Kembali</text>

  <!-- fl_ds9: P5 -> ds4 (x=860, y=615 -> 415) -->
  <path d="M 650,615 L 860,615 L 860,415 L 978,415" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="670" y="603" width="145" height="20" class="badge-bg"/>
  <text x="742" y="617" fill="#b45309" class="badge-txt" text-anchor="middle">UPDATE 'TERLAMBAT'</text>

  <!-- fl_ds10: P5 -> ds6 (y=636, straight) with Bridge Jump over x=900 -->
  <path d="M 650,636 
           L 894,636 A 6 6 0 0 1 906,636 
           L 978,636" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="680" y="642" width="145" height="20" class="badge-bg"/>
  <text x="752" y="656" fill="#065f46" class="badge-txt" text-anchor="middle">Kelola Notifikasi Deadline</text>

  <!-- fl_ds11: P6 -> ds4 (x=900, y=745 -> 428) -->
  <path d="M 650,745 L 900,745 L 900,428 L 978,428" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="670" y="733" width="140" height="20" class="badge-bg"/>
  <text x="740" y="747" fill="#0369a1" class="badge-txt" text-anchor="middle">Kueri Sirkulasi Pinjam</text>

  <!-- fl_ds12: P6 -> ent_fs (y=766, straight) -->
  <line x1="650" y1="766" x2="978" y2="766" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="710" y="756" width="160" height="20" class="badge-bg"/>
  <text x="790" y="770" fill="#065f46" class="badge-txt" text-anchor="middle">Ekspor Dokumen Excel &amp; PDF</text>

  <!-- fl_ds13: P7 -> ds1 (Clean outer loop highway x=1280) -->
  <path d="M 650,896 L 1280,896 L 1280,116 L 1242,116" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <rect x="700" y="884" width="180" height="20" class="badge-bg"/>
  <text x="790" y="898" fill="#0369a1" class="badge-txt" text-anchor="middle">Update Profil &amp; Tinjau Log Login</text>

</svg>
